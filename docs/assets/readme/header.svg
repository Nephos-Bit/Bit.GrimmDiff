<text x='80' y='108' font-size='14' fill='#A0A0A0' letter-spacing='2.5'>GIT CLIENT  /  DIFF STORYTELLER</text>
<text x='76' y='200' font-size='84' fill='#ECECEC' font-weight='600' letter-spacing='20'>grimmdiff</text>
<text x='80' y='254' font-size='28' fill='#ECECEC' >See the work behind the diff.</text>
