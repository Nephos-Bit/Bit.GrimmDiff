<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='360' viewBox='0 0 1280 360'><style>text{font-family:'Cascadia Code','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}</style><rect width='1280' height='360' fill='#1D1D1D'/><rect x='60.5' y='40.5' width='274' height='129' fill='#101010' stroke='#303030' stroke-width='1'/>
<text x='80' y='78' font-size='15' fill='#A0A0A0' >$</text>
<text x='98' y='78' font-size='15' fill='#D7A84A' font-weight='600'>git clone</text>
<text x='80' y='118' font-size='14' fill='#A0A0A0' >Open or clone a repo;</text><text x='80' y='140' font-size='14' fill='#A0A0A0' >recents are one click away.</text>
<rect x='355.5' y='40.5' width='274' height='129' fill='#101010' stroke='#303030' stroke-width='1'/>
<text x='375' y='78' font-size='15' fill='#A0A0A0' >$</text>
<text x='393' y='78' font-size='15' fill='#D7A84A' font-weight='600'>git switch</text>
<text x='375' y='118' font-size='14' fill='#A0A0A0' >Change branches straight</text><text x='375' y='140' font-size='14' fill='#A0A0A0' >from the sidebar.</text>
<rect x='650.5' y='40.5' width='274' height='129' fill='#101010' stroke='#303030' stroke-width='1'/>
<text x='670' y='78' font-size='15' fill='#A0A0A0' >$</text>
<text x='688' y='78' font-size='15' fill='#D7A84A' font-weight='600'>git fetch / pull / push</text>
<text x='670' y='118' font-size='14' fill='#A0A0A0' >Stay in sync with your</text><text x='670' y='140' font-size='14' fill='#A0A0A0' >remote in one place.</text>
<rect x='945.5' y='40.5' width='274' height='129' fill='#101010' stroke='#303030' stroke-width='1'/>
<text x='965' y='78' font-size='15' fill='#A0A0A0' >$</text>
<text x='983' y='78' font-size='15' fill='#D7A84A' font-weight='600'>git add / restore</text>
<text x='965' y='118' font-size='14' fill='#A0A0A0' >Stage and unstage</text><text x='965' y='140' font-size='14' fill='#A0A0A0' >file by file.</text>
<rect x='60.5' y='190.5' width='274' height='129' fill='#101010' stroke='#303030' stroke-width='1'/>
<text x='80' y='228' font-size='15' fill='#A0A0A0' >$</text>
<text x='98' y='228' font-size='15' fill='#D7A84A' font-weight='600'>git commit</text>
<text x='80' y='268' font-size='14' fill='#A0A0A0' >Write the message and</text><text x='80' y='290' font-size='14' fill='#A0A0A0' >commit without a terminal.</text>
<rect x='355.5' y='190.5' width='274' height='129' fill='#101010' stroke='#303030' stroke-width='1'/>
<text x='375' y='228' font-size='15' fill='#A0A0A0' >$</text>
<text x='393' y='228' font-size='15' fill='#D7A84A' font-weight='600'>git log</text>
<text x='375' y='268' font-size='14' fill='#A0A0A0' >Open any past commit and</text><text x='375' y='290' font-size='14' fill='#A0A0A0' >read it as work steps.</text>
<rect x='650.5' y='190.5' width='274' height='129' fill='#101010' stroke='#303030' stroke-width='1'/>
<text x='670' y='228' font-size='15' fill='#A0A0A0' >$</text>
<text x='688' y='228' font-size='15' fill='#D7A84A' font-weight='600'>[SHOP-121]</text>
<text x='670' y='268' font-size='14' fill='#A0A0A0' >Ticket IDs become links:</text><text x='670' y='290' font-size='14' fill='#A0A0A0' >Jira, GitHub or custom.</text>
