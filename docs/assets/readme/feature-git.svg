<text x='983' y='228' font-size='15' fill='#D7A84A' font-weight='600'>watch</text>
<text x='965' y='268' font-size='14' fill='#A0A0A0' >Changes on disk show up</text><text x='965' y='290' font-size='14' fill='#A0A0A0' >live, no manual refresh.</text></svg>