name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VPK_TOKEN: ${{ github.token }}
      CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
      CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore GrimmDiff.sln --locked-mode
      - run: dotnet run --project tests/GrimmDiff.Tests --no-restore --configuration Release
      - name: Install Velopack CLI
        run: dotnet tool install --tool-path .tools vpk --version 1.2.161
      - name: Validate release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          ./scripts/Test-ReleaseNotes.ps1 -Path "$PWD\ReleaseNotes.md" -Version ($tag.TrimStart('v'))
      - name: Import optional code-signing certificate
        id: signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERTIFICATE_BASE64)) {
            "thumbprint=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "GrimmDiff-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CODE_SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CODE_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Package Velopack release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $signing = @{}
          if ("${{ steps.signing.outputs.thumbprint }}") { $signing.CodeSigningCertificateThumbprint = "${{ steps.signing.outputs.thumbprint }}" }
          ./scripts/Publish-Velopack.ps1 -Version $version -VpkPath "$PWD\.tools\vpk.exe" -ReleaseNotesPath "$PWD\ReleaseNotes.md" @signing
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          & "$PWD\.tools\vpk.exe" upload github --repoUrl https://github.com/Nephos-Bit/Bit.GrimmDiff --outputDir "$PWD\artifacts\Releases" --channel win --publish
          if ($LASTEXITCODE -ne 0) { throw "Velopack upload failed." }
      - name: Switch to the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Prepare release notes for the next version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          ./scripts/Prepare-NextReleaseNotes.ps1 -Path "$PWD\ReleaseNotes.md" -ReleasedVersion ($tag.TrimStart('v'))
      - name: Commit next release notes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ReleaseNotes.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore: prepare release notes for next version [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
